name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Open, update, or publish the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the released revision
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable the pinned package manager
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: corepack enable

      - name: Install locked dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Re-run the release gate
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm release:check

      - name: Build and verify release artifacts
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          pnpm release:artifact "$RUNNER_TEMP/jira-markdown-exporter-release"
          cd "$RUNNER_TEMP/jira-markdown-exporter-release"
          sha256sum --check SHA256SUMS

      - name: Attach package artifacts to the GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag_name }}"
          "$RUNNER_TEMP/jira-markdown-exporter-release/jira-markdown-exporter-${{ steps.release.outputs.version }}.tgz"
          "$RUNNER_TEMP/jira-markdown-exporter-release/SHA256SUMS"
          --clobber
