name: Architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate architecture contract
        run: python3 .architecture/check.py
